<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Primary SEO -->
    <title>Adsrow | Local Digital Screen Advertising</title>

    <meta
      name="description"
      content="Adsrow helps businesses reach local audiences through digital advertising screens in apartment lift lobbies, gyms, supermarkets and cafés."
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://adsrow.com/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://adsrow.com/#organization",
        "name": "Adsrow",
        "url": "https://adsrow.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://adsrow.com/brand/adsrow-logo-primary.png"
        },
        "description": "Adsrow connects businesses with local audiences through digital screen advertising in lift lobbies, gyms, supermarkets and cafés.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+918374622055",
          "contactType": "customer service"
        }
      }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://adsrow.com/#website",
        "name": "Adsrow",
        "url": "https://adsrow.com/",
        "publisher": {
          "@id": "https://adsrow.com/#organization"
        }
      }
    </script>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adsrow" />
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:title"
      content="Adsrow | Local Digital Screen Advertising"
    />

    <meta
      property="og:description"
      content="Adsrow helps businesses reach local audiences through digital advertising screens in lift lobbies, gyms, supermarkets and cafés."
    />

    <meta property="og:url" content="https://adsrow.com/" />

    <meta
      property="og:image"
      content="https://adsrow.com/adsrow-og-image.png"
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Adsrow local digital screen advertising network"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Adsrow | Local Digital Screen Advertising"
    />

    <meta
      name="twitter:description"
      content="Adsrow helps businesses reach local audiences through digital advertising screens in lift lobbies, gyms, supermarkets and cafés."
    />

    <meta
      name="twitter:image"
      content="https://adsrow.com/adsrow-og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Adsrow local digital screen advertising network"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
