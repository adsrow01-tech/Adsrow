name: Adsrow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adsrow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # These are public client-side build values. Configure them as GitHub
      # Actions repository secrets; never put server-side secrets here.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application and prerender routes
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'maplibre-gl-worker-*.mjs' -print -quit)"

          for route in about network packages how-it-works why-adsrow faqs blog contact host-a-screen terms privacy refund-policy; do
            test -f "dist/${route}/index.html"
          done

          # The frontend build must never contain server-only credentials.
          if grep -RInE 'SUPABASE_SERVICE_ROLE_KEY|BREVO_API_KEY|BREVO_SENDER_EMAIL' dist --exclude='*.map'; then
            echo "Server-side secret reference found in dist output."
            exit 1
          fi

      - name: Upload Hostinger-ready dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: adsrow-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
