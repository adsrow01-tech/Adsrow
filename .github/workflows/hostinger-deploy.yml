name: Adsrow CI and Hostinger deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adsrow-hostinger-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/app.html
          test -s dist/404.html
          test -s dist/.htaccess
          for route in about network packages how-it-works why-adsrow faqs blog contact host-a-screen terms privacy refund-policy; do
            test -s "dist/$route/index.html"
          done
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -s dist/favicon.ico
      - name: Preview Hostinger routing and smoke test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preview-hostinger.mjs --port 4173 > /tmp/hostinger-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:4173/ -o /tmp/home.html
          grep -q 'Adsrow' /tmp/home.html
          for route in login signup forgot-password reset-password network about; do
            curl --silent --show-error --fail "http://127.0.0.1:4173/$route" -o /dev/null
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/__ci_unknown_route__)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/assets/missing-ci-asset.js)" = 404
          asset=$(find dist/assets -maxdepth 1 -type f -name '*.css' -printf '%f\n' -quit)
          test -n "$asset"
          curl --silent --show-error --fail "http://127.0.0.1:4173/assets/$asset" -o /dev/null
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: adsrow-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: hostinger-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adsrow-dist
          path: dist
      - name: Verify FTP configuration
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.HOSTINGER_FTP_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          test -n "$FTP_DIRECTORY" || { echo 'Set HOSTINGER_FTP_DIRECTORY to the confirmed temporary-domain document root.'; exit 1; }
          case "$FTP_DIRECTORY" in /*) ;; *) echo 'FTP directory must be an absolute path.'; exit 1;; esac
          case "$FTP_DIRECTORY" in *public_html*) ;; *) echo 'FTP directory must identify the intended public_html site root.'; exit 1;; esac
          test -s dist/.htaccess && test -s dist/index.html && test -s dist/app.html
      - name: Deploy verified build
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIRECTORY }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
